      const rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US'; mockRec = rec; const base = ta.value ? ta.value.replace(/\s+$/, '') + ' ' : ''; let finals = '';
      rec.onresult = ev => { let interim = ''; for(let i = ev.resultIndex; i < ev.results.length; i++){ const t = ev.results[i][0].transcript; if(ev.results[i].isFinal) finals += t + ' '; else interim += t; } ta.value = (base + finals + interim).trimStart(); it.answer = ta.value; save(); };
      rec.onerror = e => { toast(e.error === 'not-allowed' ? 'Microphone permission was denied' : 'Dictation stopped: ' + e.error); };
      rec.onend = () => { on = false; mic.classList.remove('rec'); mic.innerHTML = ico('mic', 15) + ' Dictate'; };
      try { rec.start(); on = true; mic.classList.add('rec'); mic.innerHTML = ico('mic', 15) + ' Stop dictation'; } catch(e){ toast('Could not start dictation'); }
    };
    tools.appendChild(mic);
  }
  const showB = el('button', 'btn', it.shown ? 'Hide model answer' : 'Show model answer'); showB.type = 'button';
  const skipB = el('button', 'btn ghost', 'Skip question'); skipB.type = 'button';
  const last = a.index === a.items.length - 1;
  const nextB = el('button', 'btn primary', last ? 'Finish interview' : 'Next question'); nextB.type = 'button';
  tools.append(showB, el('span', 'bar-sp'), skipB, nextB); card.appendChild(tools);
  const model = el('div', 'mk-model'); card.appendChild(model);
  const drawModel = () => {
    model.innerHTML = ''; showB.textContent = it.shown ? 'Hide model answer' : 'Show model answer'; if(!it.shown) return;
    if(!q){ model.appendChild(el('div', 'count', 'This question was deleted from the Q&A bank, so there is no model answer.')); return; }
    const sec = (cls, label, md) => { if(!(md || '').trim()) return; const d = el('div', 'qa-sec ' + cls); d.appendChild(el('div', 'qa-lbl', label)); d.appendChild(mdNode(md)); model.appendChild(d); };
    sec('know', 'Know it', q.know); sec('example', 'Example', q.example); sec('remember', 'Remember', q.remember);
    const rate = el('div', 'fld'); rate.style.marginTop = '14px'; rate.appendChild(el('label', '', 'How did your answer compare?'));
    const seg = makeSegmented(RATINGS, it.rating || ''); seg.node.addEventListener('input', () => { it.rating = seg.get(); save(); }); rate.appendChild(seg.node); model.appendChild(rate);
  };
  showB.onclick = () => { it.shown = !it.shown; save(); drawModel(); };
  const leave = () => { it.seconds += Math.round((Date.now() - a.qStart) / 1000); a.qStart = Date.now(); };
  skipB.onclick = () => { it.skipped = !(it.answer || '').trim(); leave(); if(last) finishMock('done'); else { a.index++; save(); render(); } };
  nextB.onclick = () => { leave(); if(last) finishMock('done'); else { a.index++; save(); render(); } };
  drawModel();
  const tick = () => {
    const now = Date.now(), rem = a.durationSec - (now - a.startedAt) / 1000;
    const t = $('mkTime'); if(!t) return clearInterval(mockTimerId);
    t.textContent = mmss(rem); t.classList.toggle('low', rem <= 60);
    $('mkBar').style.width = Math.min(100, Math.round((1 - rem / a.durationSec) * 100)) + '%';
    $('mkQ').textContent = mmss(it.seconds + (now - a.qStart) / 1000);
    if(rem <= 0){ clearInterval(mockTimerId); leave(); finishMock('time'); }
  };
  tick(); mockTimerId = setInterval(tick, 500);
  ta.focus({preventScroll: true});
}

/* ---------- finishing + results ---------- */
function finishMock(reason){
  const m = mockState(), a = m.active; if(!a) return;
  stopMockTools();
  const cur = a.items[a.index]; if(cur && a.qStart) cur.seconds += Math.round((Date.now() - a.qStart) / 1000);
  const session = {id: a.id, date: a.startedAt, endedAt: Date.now(), durationSec: a.durationSec, usedSec: Math.min(a.durationSec, Math.round((Date.now() - a.startedAt) / 1000)), scope: a.scope, reason, items: a.items, savedToCards: 0};
  if(a.saveToCards) a.items.forEach(i => { const q = state.qa.find(x => x.id === i.qid); if(q && (i.answer || '').trim()){ q.yours = i.answer.trim(); session.savedToCards++; } });
  m.sessions.unshift(session); m.active = null; mockView = session.id; save(); render();
  toast(reason === 'time' ? 'Time is up. Your answers are saved.' : 'Interview saved.');
}
function mockSummary(root, s){
  if(s.kind === 'live') return liveSummary(root, s);
  const m = mockState();
  setBar('Mock interview', 'Results', [{label: 'New interview', icon: 'plus', primary: true, onClick: () => { mockView = null; render(); }}]);
  const wrap = el('div', 'mock'); root.appendChild(wrap);
  const answered = s.items.filter(i => (i.answer || '').trim()).length, c = k => s.items.filter(i => i.rating === k).length;
  const head = el('div', 'card mk-res');
  head.innerHTML = '<div class="crumbs">' + esc(new Date(s.date).toLocaleString([], {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})) + ' &middot; ' + esc(s.scope) + '</div><h2>' + (s.reason === 'time' ? 'Time ran out' : s.reason === 'ended' ? 'Interview ended early' : 'Interview complete') + '</h2>' +
    '<div class="h-stats mk-stats"><div class="h-stat"><b>' + answered + ' / ' + s.items.length + '</b><span>Answered</span></div><div class="h-stat"><b>' + c('good') + '</b><span>Nailed it</span></div><div class="h-stat"><b>' + c('ok') + '</b><span>Partly</span></div><div class="h-stat"><b>' + mmss(s.usedSec) + '</b><span>of ' + Math.round(s.durationSec / 60) + ':00 used</span></div></div>' +
    '<div class="count">' + (s.savedToCards ? s.savedToCards + ' answer' + (s.savedToCards === 1 ? ' was' : 's were') + ' saved to the question cards (Your answer). ' : '') + 'This interview is kept under Past interviews.</div>';
  wrap.appendChild(head);
  wrap.appendChild(el('div', 'sec-title', 'Your answers'));
  s.items.forEach((it, i) => {
    const q = state.qa.find(x => x.id === it.qid);
    const card = el('div', 'qa open');
    const hd = el('div', 'qa-head'); hd.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="qt"><small>Question</small>' + inline(it.q) + '</span>';
    const rt = RATINGS.find(r => r[0] === it.rating);
    const chips = el('span'); chips.style.cssText = 'display:flex;gap:6px;flex:none'; chips.innerHTML = (rt ? '<span class="chip ' + (it.rating === 'good' ? 'easy' : it.rating === 'ok' ? 'medium' : 'hard') + '">' + rt[1] + '</span>' : '') + '<span class="chip">' + mmss(it.seconds) + '</span>';
    hd.appendChild(chips); card.appendChild(hd);
    const body = el('div', 'qa-body');
    const mine = el('div', 'qa-sec yours'); mine.appendChild(el('div', 'qa-lbl', 'Your answer')); mine.appendChild(el('div', 'mk-said' + ((it.answer || '').trim() ? '' : ' none'), (it.answer || '').trim() ? esc(it.answer) : (it.skipped ? 'Skipped' : 'No answer given'))); body.appendChild(mine);
    const modelWrap = el('div');
    const foot = el('div', 'qa-foot');
    if(q){
      const sm = el('button', 'btn sm', 'Show model answer'); let shown = false;
      sm.onclick = () => { shown = !shown; sm.textContent = shown ? 'Hide model answer' : 'Show model answer'; modelWrap.innerHTML = ''; if(shown){ const sec = (cls, label, md) => { if(!(md || '').trim()) return; const d = el('div', 'qa-sec ' + cls); d.appendChild(el('div', 'qa-lbl', label)); d.appendChild(mdNode(md)); modelWrap.appendChild(d); }; sec('know', 'Know it', q.know); sec('example', 'Example', q.example); sec('remember', 'Remember', q.remember); } };
      foot.appendChild(sm);
      if((it.answer || '').trim() && (q.yours || '').trim() !== it.answer.trim()){
        const sv = el('button', 'btn sm', 'Save as "Your answer" on the card'); sv.onclick = () => { q.yours = it.answer.trim(); save(); sv.remove(); toast('Saved to the question card'); }; foot.appendChild(sv);
      }
      const op = el('button', 'btn sm ghost', 'Open question'); op.onclick = () => { ui().cat = catOfSub(q.sub); ui().sub = q.sub; qaOpen.add(q.id); go('qa'); }; foot.appendChild(op);
    } else foot.appendChild(el('span', 'count', 'This question was deleted from the Q&A bank.'));
    body.append(modelWrap, foot); card.appendChild(body); wrap.appendChild(card);
  });
  const del = el('button', 'btn danger', 'Delete this interview'); del.onclick = async () => { if(await askConfirm('This interview and the answers saved in it will be deleted. Answers already copied to question cards stay.', {title: 'Delete this interview?', confirmLabel: 'Delete', danger: true})){ m.sessions = m.sessions.filter(x => x.id !== s.id); mockView = null; save(); render(); } };
  const back = el('div'); back.style.marginTop = '18px'; back.appendChild(del); wrap.appendChild(back);
}

/* ============================================================
   Data file: auto-save to a real file on disk (File System Access API)
   ============================================================ */
const fsSupported = () => 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
const PICK_TYPES = [{description: 'DevPrep data (JSON)', accept: {'application/json': ['.json']}}];
let fileHandle = null, fileName = '', fileStatus = 'none', fileMsg = '', lastSavedAt = 0, writing = false, writeAgain = false;
function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('devprep', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
/* the remembered file handle lives in IndexedDB (reassignable so it can be tested) */
let saveHandle = async h => { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(h, 'fileHandle'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
let loadHandle = async () => { const db = await idbOpen(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get('fileHandle'); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); };
let dropHandle = async () => { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete('fileHandle'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
const hasContent = s => (s.topics.length + s.qa.length + s.quiz.length + s.challenges.length) > 0;

function drawFileStatus(){
  const f = $('fstat'); if(!f) return; f.innerHTML = '';
  const say = (dot, title, text) => { f.innerHTML = '<b><i class="fdot ' + dot + '"></i>' + esc(title) + '</b>' + (text ? '<p>' + esc(text) + '</p>' : ''); };
  const act = (label, fn) => { const b = el('button', 'btn sm', esc(label)); b.onclick = () => fn(b); f.appendChild(b); };
  if(!fsSupported()) say('warn', 'Saved in this browser only', 'Saving to a file needs Chrome or Edge. Use Export backup often.');
  else if(fileStatus === 'connected') say('ok', 'Auto-saving to ' + fileName, lastSavedAt ? 'Last saved ' + new Date(lastSavedAt).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : 'Every change is written to this file.');
  else if(fileStatus === 'needs-permission'){ say('warn', 'Reconnect to ' + fileName, 'After a restart your browser needs permission again.'); act('Reconnect', reconnectFile); }
  else if(fileStatus === 'error'){ say('err', 'Could not save to the file', fileMsg); act('Reconnect', reconnectFile); }
  else { say('warn', 'Saved in this browser only', 'Connect a file to keep your data safe on your disk.'); act('Connect a file', chooseFile); }
}
function setFileStatus(s, msg){ fileStatus = s; fileMsg = msg || ''; drawFileStatus(); if(ui().tab === 'home') render(); }
function fileFail(e){
  const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
  setFileStatus(denied && fileHandle ? 'needs-permission' : 'error', e && e.message ? e.message : String(e));
}
function chooseFile(anchor){
  if(!fsSupported()){ toast('Saving to a file needs Chrome or Edge. Use Data and settings > Export backup.'); return; }
  showMenu(anchor || $('fstat'), [['Create a new data file...', createFile], ['Open an existing data file...', openFile]]);
}
async function createFile(){
  if(!fsSupported()){ toast('Saving to a file needs Chrome or Edge.'); return; }
  try { const h = await window.showSaveFilePicker({suggestedName: 'devprep-data.json', types: PICK_TYPES}); await attachFile(h, 'create'); }
  catch(e){ if(e && e.name !== 'AbortError') fileFail(e); }
}
async function openFile(){
  if(!fsSupported()){ toast('Saving to a file needs Chrome or Edge.'); return; }
  try { const picked = await window.showOpenFilePicker({types: PICK_TYPES, multiple: false}); await attachFile(picked[0], 'open'); }
  catch(e){ if(e && e.name !== 'AbortError') fileFail(e); }
}
async function attachFile(h, mode){
  if(await h.requestPermission({mode: 'readwrite'}) !== 'granted') throw new Error('Permission to write the file was not granted');
  fileHandle = h; fileName = h.name; await saveHandle(h);
  if(mode === 'create'){ setFileStatus('connected'); await writeFile(); toast('Saving to ' + fileName); }
  else await syncFromFile();
}
/* the file is the source of truth, unless this browser holds newer changes */
async function syncFromFile(){
  try {
    const f = await fileHandle.getFile(); const txt = await f.text();
    if(!txt.trim()){ setFileStatus('connected'); await writeFile(); toast('Saving to ' + fileName); return; }
    let data; try { data = JSON.parse(txt); } catch(e){ throw new Error('That file is not valid JSON'); }
    if(!data || data.v !== VER || !Array.isArray(data.topics) || !Array.isArray(data.cats)) throw new Error('That is not a DevPrep data file');
    const localNewer = (state.updatedAt || 0) > (data.updatedAt || 0) && hasContent(state);
    if(localNewer && await askConfirm('This browser has newer changes than "' + fileName + '".\n\nKeep the browser changes and update the file, or load the file and replace the changes made in this browser?', {title: 'Browser and file are different', confirmLabel: 'Keep browser changes', cancelLabel: 'Load the file instead', icon: 'warn'})){
      setFileStatus('connected'); await writeFile(); toast('File updated from this browser'); return;
    }
    state = normalizeState(data); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    quizRun = null; fileStatus = 'connected'; fileMsg = ''; lastSavedAt = Date.now(); render(); toast('Loaded your data from ' + fileName);
  } catch(e){ fileFail(e); }
}
async function writeFile(){
  if(!fileHandle || fileStatus !== 'connected') return;
  if(writing){ writeAgain = true; return; }
  writing = true;
  try {
    do { writeAgain = false; const w = await fileHandle.createWritable(); await w.write(JSON.stringify(state, null, 2)); await w.close(); lastSavedAt = Date.now(); } while(writeAgain);
    fileStatus = 'connected'; fileMsg = ''; drawFileStatus();
  } catch(e){ writing = false; fileFail(e); return; }
  writing = false;
}
async function reconnectFile(){
  if(!fileHandle) return chooseFile();
  try { if(await fileHandle.requestPermission({mode: 'readwrite'}) !== 'granted'){ toast('Permission was not granted'); return; } await syncFromFile(); }
  catch(e){ fileFail(e); }
}
async function disconnectFile(){
  if(!fileHandle){ toast('No data file is connected'); return; }
  try { await dropHandle(); } catch(e){}
  fileHandle = null; fileName = ''; setFileStatus('none'); toast('Data file disconnected. Data is saved in this browser only.');
}
async function initFile(){
  drawFileStatus();
  if(!fsSupported()) return;
  try {
    const h = await loadHandle(); if(!h) return;
    fileHandle = h; fileName = h.name;
    if(await h.queryPermission({mode: 'readwrite'}) === 'granted') await syncFromFile(); else setFileStatus('needs-permission');
  } catch(e){ fileHandle = null; setFileStatus('none'); }
}

/* ============================================================
   Menu, theme, boot
   ============================================================ */
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem('devprep.theme', t); } catch(e){} }
$('btnTheme').innerHTML = ico('moon'); $('btnAddCat').innerHTML = ico('plus', 16); $('btnAddCat').onclick = () => editCat(null);
$('btnSide').innerHTML = ico('list'); $('btnSide').onclick = () => document.body.classList.toggle('side-open'); $('sideScrim').onclick = () => document.body.classList.remove('side-open');
$('btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
try { const t = localStorage.getItem('devprep.theme'); setTheme(t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); } catch(e){}
$('mNewFile').onclick = () => { $('menu').open = false; createFile(); };
$('mOpenFile').onclick = () => { $('menu').open = false; openFile(); };
$('mDisc').onclick = () => { $('menu').open = false; disconnectFile(); };
$('mExport').onclick = () => { const a = el('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'})); a.download = 'devprep-backup.json'; a.click(); URL.revokeObjectURL(a.href); $('menu').open = false; };
$('mImport').onclick = () => { $('fileIn').click(); $('menu').open = false; };
$('fileIn').onchange = e => {
  const f = e.target.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if(d.v !== VER || !Array.isArray(d.topics) || !Array.isArray(d.cats)) throw 0; state = normalizeState(d); save(); render(); toast('Imported'); } catch(x){ showAlert('Cannot import this file', 'That file is not a compatible DevPrep backup. Choose a file that was exported from this app.'); } };
  r.readAsText(f); e.target.value = '';
};
$('mPrint').onclick = () => { $('menu').open = false; window.print(); };
$('mClear').onclick = async () => {
  $('menu').open = false;
  if(!await askConfirm('All topics, questions, quiz questions and challenges will be deleted. Your sections and sub-sections stay. Export a backup first if you may need this data again.', {title: 'Delete all content?', confirmLabel: 'Delete everything', cancelLabel: 'Keep my content', danger: true})) return;
  state.topics = []; state.qa = []; state.quiz = []; state.challenges = []; state.progress = {solved: {}, drafts: {}, quizBest: {}, quizLog: []}; state.mock = MOCK_DEFAULT(); mockView = null; stopMockTools(); ui().topic = null; ui().challenge = null; quizRun = null; save(); render(); toast('All content cleared');
};
document.addEventListener('click', e => { const m = $('menu'); if(!e.target.closest) return; if(m.open && !m.contains(e.target)) m.open = false; });
render();
initFile();

</script>
