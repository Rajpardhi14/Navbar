<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevPrep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/rxjs/7.8.1/rxjs.umd.min.js"></script>
<style>
:root{
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  --bg:#ffffff; --side:#f7f8fa; --panel:#ffffff; --panel2:#f6f7f9; --hover:#eef0f4; --active:#e9effd;
  --ink:#0f1623; --ink2:#364152; --muted:#667085; --line:#e4e7ec; --line2:#d0d5dd;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#eaf1ff;
  --ok:#157f3c; --ok-soft:#e9f7ee; --err:#b42318; --err-soft:#fdeceb; --warn:#a15c07; --warn-soft:#fdf4e3;
  --code-bg:#0f1420; --code-ink:#e6eaf4;
  --sh1:0 1px 2px rgba(16,24,40,.05); --sh2:0 4px 14px rgba(16,24,40,.08); --sh3:0 18px 48px rgba(16,24,40,.22);
  --r:10px; --r2:8px;
}
:root[data-theme="dark"]{
  --bg:#0d0f13; --side:#11141a; --panel:#13161c; --panel2:#181c23; --hover:#1c2029; --active:#1b2640;
  --ink:#e9ecf2; --ink2:#c2c8d4; --muted:#8c94a6; --line:#242933; --line2:#303642;
  --accent:#6b9bff; --accent-ink:#0d0f13; --accent-soft:#1a2745;
  --ok:#4ade80; --ok-soft:#10261a; --err:#f87171; --err-soft:#2d1517; --warn:#fbbf24; --warn-soft:#2b210b;
  --code-bg:#090b10; --sh1:none; --sh2:none; --sh3:0 18px 48px rgba(0,0,0,.65);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv05","ss03"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.ic{flex:none;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,textarea.mono{font-family:var(--mono)}

/* ================= app shell ================= */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);padding:16px 12px 12px;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);font-style:normal;font-size:13px;font-weight:700}
.snav{display:flex;flex-direction:column;gap:2px}
.sitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border:none;background:none;border-radius:var(--r2);font-size:14px;font-weight:500;color:var(--ink2);text-align:left;transition:background .12s}
.sitem svg{color:var(--muted)}
.sitem:hover{background:var(--hover)}
.sitem.on{background:var(--active);color:var(--ink);font-weight:600}
.sitem.on svg{color:var(--accent)}
.stitle{display:flex;align-items:center;justify-content:space-between;margin:22px 10px 6px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tree{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px}
.tree-hint{padding:6px 10px;font-size:13px;color:var(--muted)}
.n-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:var(--r2);cursor:pointer;font-size:13.5px;font-weight:500;position:relative;user-select:none;color:var(--ink2)}
.n-row:hover{background:var(--hover)}
.n-row.on{background:var(--active);color:var(--ink);font-weight:600}
.n-row .chev{width:14px;height:14px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.n-row .chev.open{transform:rotate(90deg)}
.n-row .chev.sp{visibility:hidden}
.n-row .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.n-row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-row .cnt{font-size:11.5px;font-weight:600;color:var(--muted);min-width:18px;text-align:right}
.n-row .more{opacity:0;margin-left:-2px}
.n-row:hover .more{opacity:1}
.n-sub{margin-left:18px}
.n-topic{margin-left:40px;font-weight:400;font-size:13px;color:var(--muted);padding:4px 8px}
.n-topic.on{color:var(--ink);font-weight:600}
.n-all{margin-bottom:2px}
.fstat{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.fstat b{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;min-width:0}
.fstat p{margin:0;color:var(--muted);line-height:1.45}
.fstat .btn{align-self:flex-start}
.fdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.fdot.ok{background:var(--ok)} .fdot.warn{background:#d98a0b} .fdot.err{background:var(--err)}
.protect{display:flex;gap:10px;align-items:center;padding:14px 16px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft);border-radius:var(--r);margin-bottom:24px;flex-wrap:wrap}
.protect .grow{flex:1;min-width:240px}
.protect b{display:block;color:var(--ink)}
.protect p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.side-foot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.menu{position:relative;flex:1}
.menu summary{list-style:none;width:100%;justify-content:flex-start}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;left:0;bottom:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh3);padding:6px;min-width:250px;display:flex;flex-direction:column;z-index:80}
.menu .pop button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:6px;font-size:13.5px}
.menu .pop button:hover{background:var(--hover)}
.menu .pop hr{border:none;border-top:1px solid var(--line);margin:4px 0}

.content{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:12px;padding:0 32px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-title{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden}
.bar-title b{color:var(--ink);font-weight:600}
.bar-title .sep{color:var(--line2)}
.bar-title .scope{overflow:hidden;text-overflow:ellipsis}
.bar-sp{flex:1}
.bar-actions{display:flex;gap:8px;align-items:center}
.icon-btn.menu-btn{display:none}
.page{width:100%;max-width:1180px;margin:0 auto;padding:30px 32px 96px}
.page.narrow{max-width:960px}

/* ================= controls ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:var(--r2);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--err)}
.btn.danger:hover{background:var(--err-soft);border-color:var(--err)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:none;background:none;width:30px;height:30px;border-radius:var(--r2);display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.sm{width:24px;height:24px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:500;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
.chip.t::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.easy{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.medium{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.hard{color:var(--err);background:var(--err-soft);border-color:transparent}
.count{font-size:13px;color:var(--muted)}
.empty{padding:64px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty h3{margin:0;color:var(--ink);font-size:16px;font-weight:600}
.empty p{margin:0 0 12px;max-width:440px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:34px;padding:0 12px 0 34px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.sec-title{display:flex;align-items:center;gap:10px;margin:28px 0 10px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-title .dot,.crumbs .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.crumbs a,.crumbs b{color:var(--muted);font-weight:500;cursor:pointer;text-decoration:none}
.crumbs a:hover,.crumbs b:hover{color:var(--ink)}
.page-title{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.022em;font-weight:650}
.head-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ================= home ================= */
.home h1{margin:0 0 4px;font-size:26px;letter-spacing:-.022em;font-weight:650}
.home .lead{margin:0;color:var(--muted)}
.h-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:26px 0 28px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.h-stat{padding:16px 20px}
.h-stat+.h-stat{border-left:1px solid var(--line)}
.h-stat b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.h-stat span{font-size:13px;color:var(--muted)}
.h-cont{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:28px;flex-wrap:wrap;background:var(--panel)}
.h-lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.h-ct{font-weight:600}
.h-path{color:var(--muted);font-size:13px;flex:1;min-width:120px}
.h-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.h-head h2{margin:0;font-size:15px;font-weight:600}
.h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.h-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 10px}
.h-ctop{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:8px}
.h-ctop .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.h-rows{display:flex;flex-direction:column;margin-bottom:6px}
.h-row{display:flex;justify-content:space-between;align-items:center;border:none;background:none;text-align:left;padding:7px 8px;margin:0 -8px;border-radius:6px;font-size:13.5px;color:var(--ink2)}
.h-row:hover{background:var(--hover);color:var(--ink)}
.h-row em{font-style:normal;color:var(--muted);font-size:12.5px}
.h-none{color:var(--muted);font-size:13.5px;padding:4px 0 8px}
.h-links{display:flex;gap:2px;border-top:1px solid var(--line);padding-top:6px;margin:0 -8px}
.h-links button{border:none;background:none;padding:4px 9px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.h-links button:hover{background:var(--hover);color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:30px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.step b.n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px}
.step h3{margin:4px 0 0;font-size:14.5px;font-weight:600}
.step p{margin:0 0 6px;color:var(--muted);font-size:13.5px;flex:1}

/* ================= learn ================= */
.learn{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:40px;align-items:start}
.article{max-width:780px}
.rail{position:sticky;top:84px;font-size:13px}
.rail h6{margin:0 0 8px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail a{display:block;padding:4px 12px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;line-height:1.45}
.rail a:hover{color:var(--ink)}
.rail a.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px;padding-top:24px;border-top:1px solid var(--line);max-width:780px}
.pn button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 16px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);transition:border-color .12s}
.pn button:hover{border-color:var(--line2);background:var(--panel2)}
.pn small{color:var(--muted);font-weight:500;font-size:12px}
.pn b{font-weight:600}
.pn .nx{text-align:right}

/* ================= markdown ================= */
.md{font-size:15px;color:var(--ink2);line-height:1.7}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md h2{font-size:20px;margin:36px 0 10px;letter-spacing:-.015em;color:var(--ink);font-weight:650;scroll-margin-top:84px}
.md h3{font-size:16px;margin:26px 0 6px;color:var(--ink);font-weight:650}
.md h4{font-size:12.5px;margin:20px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.md p{margin:11px 0}
.md ul,.md ol{margin:11px 0;padding-left:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--muted)}
.md b,.md strong{color:var(--ink);font-weight:600}
.md code{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:1px 5px;border-radius:5px;font-size:12.5px}
.md a{color:var(--accent)}
.md hr{border:none;border-top:1px solid var(--line);margin:24px 0}
.md blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 8px 8px 0;color:var(--ink)}
.md blockquote p{margin:4px 0}
.md .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin:16px 0}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.md tr:last-child td{border-bottom:none}
.md th{background:var(--panel2);font-weight:600;white-space:nowrap;color:var(--ink);font-size:12.5px}
.md pre.static{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:var(--r);overflow:auto;font:12.5px/1.65 var(--mono);margin:14px 0}

/* ================= code runner ================= */
.runner{border:1px solid #232a3b;border-radius:var(--r);overflow:hidden;margin:16px 0;background:var(--code-bg)}
.runner .rbar{display:flex;gap:8px;align-items:center;padding:7px 12px;background:#161c2b;color:#9aa6c2;font-size:12px}
.runner .rbar .grow{flex:1}
.runner .badge{font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:5px;background:#26304a;color:#d7def2;font-size:11px}
.runner .badge.ts{background:#1f4a8c}
.runner .badge.js{background:#7a5f10}
.runner .rbtn{height:26px;border:1px solid #33405e;background:#222b42;color:#e6eaf4;border-radius:6px;padding:0 11px;font-size:12px;font-weight:500}
.runner .rbtn:hover{background:#2c3856}
.runner .rbtn.run{background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:600}
.runner .rbtn.run:hover{background:#25b563}
.runner .rbtn.stop{background:#d1352b;border-color:#d1352b;color:#fff}
.runner textarea{display:block;width:100%;border:none;outline:none;resize:none;background:var(--code-bg);color:var(--code-ink);font:13px/1.65 var(--mono);padding:14px 16px;tab-size:2;white-space:pre;overflow:auto}
.runner .out{display:none;margin:0;background:#05070c;color:#cbd5e1;font:12.5px/1.6 var(--mono);padding:10px 16px;max-height:260px;overflow:auto;white-space:pre-wrap;border-top:1px solid #161c2b}
.runner .out .t{color:#5f6b8a;margin-right:10px}
.runner .out .e{color:#ff8a8a}
.runner .out .i{color:#fbbf24}
.runner .out .ok{color:#4ade80}
.runner .res{display:none;background:#080b13;border-top:1px solid #161c2b;padding:12px 16px;font:13px/1.55 var(--font)}
.runner .res .sum{font-weight:600;margin-bottom:6px}
.runner .res .row{display:flex;gap:8px;color:#cbd5e1;padding:2px 0}
.runner .res .row.ok .m{color:#4ade80}
.runner .res .row.bad .m{color:#ff8a8a}
.runner .res .why{color:#94a0bf;font:12px var(--mono);margin-left:22px}

/* ================= Q&A ================= */
.qa{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .12s}
.qa:hover{border-color:var(--line2)}
.qa.open{border-color:var(--line2);box-shadow:var(--sh2)}
.qa-head{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:14px 18px}
.qa-head .num{flex:none;min-width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line)}
.qa-head .qt{flex:1;font-weight:600;font-size:15px;line-height:1.45;color:var(--ink)}
.qa-head .qt small{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.qa-head .chev{color:var(--muted);transition:transform .15s}
.qa.open .qa-head .chev{transform:rotate(90deg)}
.qa-body{padding:2px 18px 18px 58px;display:flex;flex-direction:column;gap:12px}
.qa-sec{border-left:3px solid var(--line2);padding:2px 0 2px 14px}
.qa-lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px;color:var(--muted)}
.qa-sec.yours{border-left-style:dashed}
.qa-sec.yours .md{font-style:italic;color:var(--muted)}
.qa-sec.know{border-left-color:var(--ok)}
.qa-sec.know .qa-lbl{color:var(--ok)}
.qa-sec.example{border-left-color:var(--accent)}
.qa-sec.example .qa-lbl{color:var(--accent)}
.qa-sec.remember{border-left-color:var(--warn)}
.qa-sec.remember .qa-lbl{color:var(--warn)}
.qa-sec .md>p:first-child{margin-top:4px}
.qa-sec .runner{margin:10px 0 4px}
.qa-foot{display:flex;gap:8px;justify-content:flex-end}

/* ================= quiz ================= */
.q-setup{padding:26px 28px;max-width:640px}
.q-setup h2{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.scope-pill{display:inline-flex;align-items:center;gap:8px;margin:14px 0 4px;padding:5px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:500;font-size:13px}
.form-row{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}
.form-row .fld{margin:0}
.q-run{max-width:760px;padding:26px 30px}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:8px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:16px}
.q-text{font-size:18px;font-weight:600;margin-bottom:18px;color:var(--ink);line-height:1.45}
.q-text .md{font-size:18px;color:var(--ink)}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:12px 16px;margin-bottom:10px;line-height:1.5;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:12px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt.wrong .k{background:var(--err);color:#fff;border-color:var(--err)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line)}
.score-big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1}
.review{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.bank{max-width:640px;margin-top:18px}
.bank-row{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.bank-row:last-child{border-bottom:none}
.bank-row .bt{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= mock interview ================= */
.mock{max-width:860px}
.mk-setup{padding:26px 28px;margin-bottom:8px}
.mk-setup h2{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.015em}
.mk-setup .fld{margin-top:18px;margin-bottom:0}
.mk-setup .help{margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.mk-plan{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);font-size:14px}
.mk-top{display:flex;gap:28px;align-items:center;padding:16px 22px;margin-bottom:14px}
.mk-lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mk-time{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.mk-time.low{color:var(--err)}
.mk-mid{flex:1;min-width:0}
.mk-card{padding:24px 26px}
.mk-q{font-size:19px;font-weight:600;line-height:1.45;color:var(--ink);margin-top:2px}
.mk-q .md{font-size:19px;color:var(--ink)}
.mk-card textarea{min-height:190px}
.mk-tools{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn.rec{border-color:var(--err);color:var(--err);background:var(--err-soft)}
.mk-model{margin-top:6px}
.mk-model .qa-sec{margin-top:14px}
.mk-hist{margin-top:34px}
.sess{display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel)}
.sess .si{display:flex;flex-direction:column;min-width:96px;font-size:13px}
.sess .si span,.sess .smeta span{color:var(--muted);font-size:12.5px}
.sess .smeta{flex:1;min-width:0;display:flex;flex-direction:column}
.mk-res{padding:22px 26px;margin-bottom:6px}
.mk-res h2{margin:2px 0 0;font-size:22px;font-weight:650;letter-spacing:-.015em}
.mk-res .mk-stats{margin:16px 0 12px}
.mk-said{white-space:pre-wrap;font-size:14.5px;color:var(--ink)}
.mk-said.none{color:var(--muted);font-style:italic}

/* ================= live interviewer ================= */
.mode{margin-bottom:16px}
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.vrow .cs{flex:1;min-width:200px}
.fld .row2 .chk{margin-top:6px}
details.how{margin-top:18px}
.live .lv-top{flex-wrap:wrap}
.lv-ctl{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{height:28px;padding:0 12px;border:1px solid var(--line2);background:var(--panel);border-radius:99px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chipbtn:hover{border-color:var(--muted);color:var(--ink)}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.lv-chat{padding:18px 20px;height:min(52vh,520px);min-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;scroll-behavior:smooth}
.bub{display:flex;gap:10px;max-width:86%;align-items:flex-start}
.bub .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg)}
.bub .bt{padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.bub.me{align-self:flex-end;flex-direction:row-reverse}
.bub.me .av{background:var(--accent);color:var(--accent-ink)}
.bub.me .bt{background:var(--accent-soft);border-color:transparent}
.bub.typing{gap:5px;padding:10px 14px;background:var(--panel2);border-radius:14px;width:fit-content;border:1px solid var(--line)}
.bub.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.2s}.bub.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.lv-code{border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;background:var(--panel);max-width:100%}
.lv-ct{font-weight:600;font-size:13.5px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.lv-code pre.static{margin:0}
.lv-code.coding{padding:14px 16px}
.lv-crow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lv-input{padding:12px 14px}
.lv-input textarea{display:block;width:100%;resize:vertical;min-height:70px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);outline:none;font-size:14.5px}
.lv-input textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.lv-status{font-size:12.5px;color:var(--muted);margin:8px 2px 0;min-height:18px}
.lv-status.listening{color:var(--err);font-weight:600}
.lv-status.speaking{color:var(--accent);font-weight:600}
.lv-acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.transcript p{margin:6px 0;font-size:13.5px}
.transcript .ti{color:var(--ink)}.transcript .tm{color:var(--ink2);padding-left:12px;border-left:2px solid var(--line2)}
.gen-bar{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.gen-list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto}
.gen-row{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);cursor:pointer}
.gen-row:hover{border-color:var(--line2)}
.gen-row input{margin-top:4px;accent-color:var(--accent)}
.gb{min-width:0}
.gq{font-weight:600;font-size:14px;line-height:1.4}
.gm{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.gr{font-size:12.5px;color:var(--muted)}

/* ================= progress ================= */
.prog{max-width:980px}
.pg-head h1{margin:0 0 4px;font-size:26px;font-weight:650;letter-spacing:-.022em}
.pg-head .lead{margin:0;color:var(--muted)}
.prog .h-stats{margin-top:22px}
.pg-goal{display:flex;gap:20px;align-items:center;padding:16px 20px;margin-bottom:14px}
.pg-goal .grow{flex:1}
.pg-chart{padding:18px 20px;margin-bottom:6px}
.pg-ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.plot{position:relative;height:190px;border-bottom:1px solid var(--line)}
.goalline{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);z-index:1}
.goalline span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:6px;z-index:2}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.col .cbar{width:100%;max-width:34px;background:var(--line2);border-radius:5px 5px 0 0;min-height:2px}
.col .cbar.hit{background:var(--accent)}
.col.today .cbar{background:var(--accent);opacity:.65}
.col.today .cbar.hit{opacity:1}
.col .lab{position:absolute;top:100%;margin-top:6px;font-size:11px;line-height:1.25;color:var(--muted);text-align:center}
.pg-break{margin-top:46px;display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.brow{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.brow em{font-style:normal;color:var(--muted);text-align:right}
.track{height:7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.track i.g{background:var(--ok)}.track i.o{background:#d98a0b}.track i.r{background:var(--err)}
.track.none{opacity:.5}
.pg-ready{padding:22px 24px}
.rd-big{display:flex;gap:20px;align-items:center;margin:2px 0 6px}
.rd-big .num{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;min-width:110px}
.rd-big .num.g{color:var(--ok)}.rd-big .num.o{color:var(--warn)}.rd-big .num.r{color:var(--err)}
.rd-big p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.rd-table{margin-top:14px;display:flex;flex-direction:column}
.rd-cat{display:flex;gap:9px;align-items:center;margin:14px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.rd-cat .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rd-cat em{font-style:normal;margin-left:auto;color:var(--muted);font-size:13px}
.rd-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr 52px;gap:6px 12px;align-items:center;padding:7px 0;font-size:13.5px}
.rd-row .meta{grid-column:2 / -1;font-size:12px;color:var(--muted);margin-top:-2px}
.rd-row b{text-align:right}
.rd-table.pad{padding:14px 18px}
.card.pad{padding:16px 20px}
.rd-h{margin:22px 0 8px;font-size:14px;font-weight:600}
.rd-list{margin:0;padding-left:20px;color:var(--ink2)}
.rd-list li{margin:5px 0}
.rd-focus{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rd-focus .grow{flex:1;display:flex;flex-direction:column}
.spark{display:flex;gap:10px;align-items:flex-end;height:90px}
.sbar{flex:1;max-width:46px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.sbar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.sbar span{font-size:11px;color:var(--muted)}
.rd-note{margin-top:18px}
@media (max-width:900px){.pg-break{grid-template-columns:1fr}.bub{max-width:96%}.rd-row{grid-template-columns:1fr 52px}.rd-row .track{grid-column:1 / -1;grid-row:2}.rd-row .meta{grid-column:1 / -1}}

/* ================= practice ================= */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:26px}
.pick{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);transition:border-color .12s;position:relative}
.pick:hover{border-color:var(--line2)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pick .pt{font-weight:600;font-size:14px;line-height:1.35;padding-right:18px}
.pick .tick{position:absolute;right:12px;top:10px;color:var(--ok);font-weight:700}
.pick .row{display:flex;gap:6px;align-items:center}
.prompt{padding:20px 24px;margin-bottom:6px}
details.fold{margin:10px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.fold summary{padding:10px 16px;cursor:pointer;font-weight:500;font-size:13.5px}
details.fold .in{padding:0 16px 14px}

/* ================= drawer / forms ================= */
.drawer-wrap{position:fixed;inset:0;z-index:150;display:flex;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(10,13,18,.45);opacity:0;transition:opacity .2s}
.drawer{position:relative;width:min(720px,100vw);height:100%;background:var(--panel);box-shadow:var(--sh3);display:flex;flex-direction:column;transform:translateX(32px);opacity:0;transition:transform .22s ease,opacity .22s}
.drawer-wrap.open .scrim{opacity:1}
.drawer-wrap.open .drawer{transform:none;opacity:1}
.dh{padding:20px 28px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .tt{flex:1}
.dh h2{margin:0;font-size:18px;letter-spacing:-.012em;font-weight:650}
.dh p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.db{flex:1;overflow:auto;padding:2px 28px 32px}
.df{padding:12px 28px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel)}
.df .err{flex:1;color:var(--err);font-size:13px;font-weight:500;min-width:0}
.fsec{margin-top:24px}
.fsec>.fst{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.fsec>.fst b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11.5px}
.fld{margin-bottom:18px;min-width:0}
.fld>label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:6px}
.req{color:var(--err)}
.fld .help{font-size:12.5px;color:var(--muted);margin-top:6px}
.sublabel{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld input[type=text],.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);outline:none;transition:border-color .12s,box-shadow .12s}
.fld input[type=text]{height:38px}
.fld input[type=text]:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.fld textarea{resize:vertical;font:13px/1.6 var(--mono);tab-size:2}
.fld.bad>input,.fld.bad>textarea,.fld.bad .cs-btn,.fld.bad .mdbox,.fld.bad .orow input{border-color:var(--err)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 12%,transparent)!important}
.cs{position:relative;min-width:0}
.cs-btn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:0 12px;height:38px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);font-weight:400}
.cs-btn:hover{border-color:var(--muted)}
.cs-btn[aria-expanded=true],.cs-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);outline:none}
.cs-btn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-btn .lab.ph{color:var(--muted)}
.cs-btn svg{color:var(--muted);transform:rotate(90deg)}
.cs .dot,.cs-menu .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cs-menu{position:fixed;z-index:400;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh3);padding:5px;max-height:320px;overflow:auto}
.cs-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:none;background:none;border-radius:6px;font-weight:400;font-size:14px}
.cs-opt:hover,.cs-opt.act{background:var(--hover)}
.cs-opt.sel{font-weight:600}
.cs-opt .chk{margin-left:auto;color:var(--accent);display:grid}
.cs-opt small{color:var(--muted)}
.cs-new{color:var(--accent);font-weight:500}
.cs-sep{height:1px;background:var(--line);margin:5px 2px}
.cs-empty{padding:10px 12px;color:var(--muted);font-size:13px}
.cs-create{display:flex;gap:6px;padding:6px}
.cs-create input{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);outline:none}
.cs-create input:focus{border-color:var(--accent)}
.seg{display:inline-flex;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;height:28px;padding:0 14px;border-radius:6px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.orow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.orow .letter{width:24px;height:24px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.orow input[type=text]{flex:1;min-width:0}
.orow .corr{flex:none;height:30px;border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.orow .corr:hover{border-color:var(--ok);color:var(--ok)}
.orow .corr.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);background:var(--c);box-shadow:0 0 0 1px var(--line2)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.mdbox{border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);overflow:hidden}
.mdhead{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.mdtabs{display:flex;gap:2px}
.mdtabs button{border:none;background:none;height:26px;padding:0 11px;border-radius:6px;font-weight:500;font-size:13px;color:var(--muted)}
.mdtabs button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.mdtools{display:flex;gap:1px;flex-wrap:wrap;margin-left:auto}
.mdtools button{border:none;background:none;height:26px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.mdtools button:hover{background:var(--panel);color:var(--accent)}
.fld .mdbox textarea{border:none;border-radius:0;box-shadow:none;background:var(--panel);display:block}
.mdbox .prev{border:none;min-height:140px;padding:10px 16px;background:var(--panel)}
.prev:empty::before{content:"Nothing to preview yet";color:var(--muted);font-size:13px}

/* ================= overlays ================= */
.dlg-wrap{position:fixed;inset:0;z-index:260;display:grid;place-items:center;padding:20px}
.dlg-scrim{position:absolute;inset:0;background:rgba(10,13,18,.5);opacity:0;transition:opacity .16s}
.dlg{position:relative;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh3);padding:22px 22px 18px;transform:translateY(8px) scale(.98);opacity:0;transition:transform .17s ease,opacity .17s ease}
.dlg-wrap.open .dlg-scrim{opacity:1}
.dlg-wrap.open .dlg{transform:none;opacity:1}
.dlg-top{display:flex;gap:14px;align-items:flex-start}

function fmtVal(v){
  if(typeof v === 'string') return v;
  if(v instanceof Error) return v.name + ': ' + v.message;
  if(v === undefined) return 'undefined';
  if(typeof v === 'function') return 'function ' + (v.name || '');

}
function deepEqual(a, b){
  if(Object.is(a, b)) return true;
  if(typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if(Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length !== kb.length) return false;
  return ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}
function makeExpect(actual){
  const fail = (exp, word) => { throw new Error('Expected ' + (word || '') + fmtVal(exp) + ' but got ' + fmtVal(actual)); };
  return {
    toBe: exp => { if(!Object.is(actual, exp)) fail(exp); },
    toEqual: exp => { if(!deepEqual(actual, exp)) fail(exp); },
    toBeUndefined: () => { if(actual !== undefined) fail(undefined); },
    toBeTruthy: () => { if(!actual) fail(true, 'a truthy value, '); },
    toThrow: () => { let threw = false; try { actual(); } catch(e){ threw = true; } if(!threw) throw new Error('Expected the function to throw'); }
  };
}
async function runTests(tests, timeoutMs){

      await Promise.race([
        Promise.resolve().then(t.f),
        new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('Timed out after ' + timeoutMs + 'ms (does your function ever finish?)')), timeoutMs); })

    } catch(e){ results.push({name: t.name, ok: false, msg: e && e.message ? e.message : String(e)}); }
    clearTimeout(timer);
  }

}

function parseSeed(txt){
  const items = []; let cur = null, fname = null;
  txt.replace(/\r/g, '').split('\n').forEach(line => {
    if(line.startsWith('@@')){
      const parts = line.slice(2).trim().split(/\s+/); const kind = parts[0], rest = parts.slice(1);
      cur = {kind, f: {}}; items.push(cur); fname = null;
      if(kind === 'cat'){ cur.id = rest[0]; cur.color = rest[rest.length - 1]; cur.name = rest.slice(1, -1).join(' '); }
      else if(kind === 'sub'){ cur.id = rest[0]; cur.name = rest.slice(1).join(' '); }
      else if(kind === 'topic'){ cur.sub = rest[0]; cur.title = rest.slice(1).join(' '); fname = 'body'; cur.f.body = [[]]; }
      else if(kind === 'qa'){ cur.sub = rest[0]; }
      else if(kind === 'quiz'){ cur.sub = rest[0]; cur.ans = parseInt(rest[1], 10) - 1; }
      else if(kind === 'challenge'){ cur.sub = rest[0]; cur.lang = rest[1]; cur.level = rest[2]; cur.title = rest.slice(3).join(' '); }
      return;
    }
    if(!cur) return;
    const m = line.match(/^::(\w+)\s*$/);
    if(m){ fname = m[1]; (cur.f[fname] = cur.f[fname] || []).push([]); return; }
    if(fname){ const arr = cur.f[fname]; arr[arr.length - 1].push(line); }
  });
  return items;
}
function field(item, name){ const a = item.f[name]; return a ? a[0].join('\n').replace(/^\n+/, '').replace(/\s+$/, '') : ''; }

      const c = el('button', 'corr' + (i === correct ? ' on' : ''), i === correct ? '&#10003; Correct answer' : 'Mark as correct'); c.type = 'button'; c.onclick = () => { correct = i; draw(); wrap.dispatchEvent(new Event('input', {bubbles: true})); };
      const x = el('button', 'icon-btn'); x.type = 'button'; x.title = 'Remove this option'; x.innerHTML = ico('x', 16); x.disabled = items.length <= 2;
      x.onclick = () => { items.splice(i, 1); if(i < correct) correct--; else if(correct >= items.length) correct = items.length - 1; draw(); wrap.dispatchEvent(new Event('input', {bubbles: true})); };
      r.append(el('span', 'letter', L[i]), inp, c, x); list.appendChild(r);
    });
    addB.classList.toggle('hidden', items.length >= 6);
  };
  addB.onclick = () => { items.push({t: ''}); draw(); };
  wrap.append(list, addB); draw();
  return {node: wrap, get: () => { const out = []; let ans = -1; items.forEach((it, i) => { const t = it.t.trim(); if(t){ if(i === correct) ans = out.length; out.push(t); } }); return {options: out, answer: ans}; }, box: wrap};
}

/* cfg: {title, subtitle, saveLabel, fields, values, onSave(data)->string|undefined, onDelete?}

    const r = await cfg.onSave(data); if(typeof r === 'string'){ fail(r); return; }

}

function editCat(cat){
  openForm({
    title: cat ? 'Edit section' : 'New section',
    values: cat ? {name: cat.name, color: cat.color} : {color: COLORS[state.cats.length % COLORS.length]},
    subtitle: 'A section is a main area, for example Angular or Node.js. You can add sub-sections inside it.',
    saveLabel: cat ? 'Save changes' : 'Add section',
    fields: [
      {key: 'name', label: 'Section name', type: 'text', required: true, placeholder: 'For example: Angular, Node.js, SQL'},
      {key: 'color', label: 'Colour dot', type: 'swatch', help: 'Only used as a small marker in the list.'}
    ],
    onSave: d => {
      if(!d.name.trim()) return 'Name is required';
      if(cat){ cat.name = d.name.trim(); cat.color = d.color; }
      else { let id = slug(d.name); while(state.cats.some(c => c.id === id)) id += '-' + uid().slice(0, 2); state.cats.push({id, name: d.name.trim(), color: d.color}); ui().open[id] = true; ui().cat = id; ui().sub = null; }
      save(); render(); toast('Saved');
    },
    onDelete: cat ? () => { removeCat(cat.id); save(); render(); toast('Section deleted'); } : null
  });
}
function editSub(sub, catId){
  openForm({
    title: sub ? 'Edit sub-section' : 'New sub-section',
    values: sub ? {name: sub.name, cat: sub.cat} : {cat: catId || (state.cats[0] || {}).id},

      {key: 'cat', label: 'Belongs to section', type: 'select', required: true, options: state.cats.map(c => [c.id, c.name, c.color]), placeholder: 'Choose a section'}
    ],
    onSave: d => {
      if(!d.name.trim()) return 'Name is required';
      if(sub){ sub.name = d.name.trim(); sub.cat = d.cat; }
      else { let id = d.cat + '/' + slug(d.name); while(state.subs.some(s => s.id === id)) id += '-' + uid().slice(0, 2); state.subs.push({id, cat: d.cat, name: d.name.trim()}); ui().open[d.cat] = true; ui().cat = d.cat; ui().sub = id; }

async function delCat(cat){

async function delSub(sub){

function quizQuestion(main){

  const qt = el('div', 'q-text'); qt.appendChild(mdNode(q.q, {runnable: false}));

/* ---------- key-term matching ---------- */
const STOPWORDS = new Set('about above after again against also another because been before being below between both cannot could does doing down during each either else every from further have having here hers himself into itself just keep know like made make many might more most much must myself never next once only other ought over same shall should since some such than that their theirs them then there these they this those through under until upon very want were what when where which while whom will with within without would yours yourself your need needs used using use uses'.split(' '));

function keyTerms(refMd, max){
  const terms = new Map(); const raw = String(refMd || '');
  (raw.match(/`([^`\n]{2,40})`/g) || []).forEach(t => {

    const lw = w.toLowerCase();
    if(/[a-z][A-Z]/.test(w)){ terms.set('id:' + lw, {term: w, w: 3, id: true}); return; }

}
const EX_RE = /\b(for example|for instance|e\.g\.|such as|in my (last |previous )?(project|job|company|team)|i (once|have|had|worked|built|used)|we (used|had|built)|imagine|suppose|say you|let'?s say)\b|`|\(\)/i;
const TRADE_RE = /\b(trade-?off|downside|drawback|disadvantage|however|but|whereas|unlike|instead of|rather than|on the other hand|cost|risk|limitation|depends|versus|vs\.?|compared)\b/i;

const IDK_RE = /\b(i (don'?t|do not|dunno) know|no idea|not sure|can'?t remember|cannot remember|i forgot|skip (this|it)|i pass)\b/i;
function evaluateAnswer(answer, refMd){
  const a = String(answer || '').trim(); const words = wordsOf(a).length;
  const empty = {score: 0, coverage: 0, words: 0, missing: [], hit: [], hasExample: false, hasTradeoff: false, hasReason: false};
  if(!a) return empty;
  const low = a.toLowerCase(); const stems = new Set(wordsOf(a).map(stemW));
  const terms = refMd ? keyTerms(refMd, 14) : [];
  let tot = 0, got = 0; const missing = [], hit = [];
  terms.forEach(t => { tot += t.w; const present = t.id ? low.includes(t.term.toLowerCase()) : stems.has(stemW(t.term)); if(present){ got += t.w; hit.push(t.term); } else missing.push(t.term); });

  const hasExample = EX_RE.test(a), hasTradeoff = TRADE_RE.test(a), hasReason = REASON_RE.test(a);

    ? 100 * (0.68 * Math.min(1, coverage / 0.55) + 0.14 * lenScore + 0.09 * (hasExample ? 1 : 0) + 0.09 * (hasReason || hasTradeoff ? 1 : 0))
    : 100 * (0.5 * lenScore + 0.25 * (hasExample ? 1 : 0) + 0.15 * (hasReason ? 1 : 0) + 0.10 * (hasTradeoff ? 1 : 0));
  return {score: Math.round(clamp(score, 0, 100)), coverage, words, missing, hit, hasExample, hasTradeoff, hasReason};
}

/* ---------- reading a topic's Markdown ---------- */
function parseTopic(body){
  const lines = String(body || '').replace(/\r/g, '').split('\n'); const secs = [{heading: '', blocks: []}]; let i = 0;
  const cur = () => secs[secs.length - 1];
  while(i < lines.length){
    const l = lines[i]; let m;
    if((m = l.match(/^```(\w*)\s*$/))){ const buf = []; i++; while(i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]); i++; cur().blocks.push({type: 'code', lang: (m[1] || '').toLowerCase(), code: buf.join('\n')}); continue; }
    if((m = l.match(/^#{1,3}\s+(.*)$/))){ secs.push({heading: plainMd(m[1]), blocks: []}); i++; continue; }
    if(!l.trim()){ i++; continue; }
    if(/^>/.test(l)){ const b = []; while(i < lines.length && /^>/.test(lines[i])) b.push(lines[i++].replace(/^>\s?/, '')); cur().blocks.push({type: 'quote', text: plainMd(b.join(' '))}); continue; }
    if(/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')){
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const head = cells(l).map(plainMd); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]).map(plainMd));
      cur().blocks.push({type: 'table', head, rows}); continue;
    }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ const items = []; while(i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(plainMd(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''))); cur().blocks.push({type: 'list', items}); continue; }
    const p = [l]; i++;
    while(i < lines.length && lines[i].trim() && !/^(```|#|>|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) p.push(lines[i++]);
    cur().blocks.push({type: 'p', text: plainMd(p.join(' '))});
  }

}
const sectionText = sec => sec.blocks.filter(b => b.type === 'p' || b.type === 'quote').map(b => b.text).concat(sec.blocks.filter(b => b.type === 'list').map(b => b.items.join('. '))).join(' ');

/* ---------- turning topics into interview questions ---------- */
function genFromTopic(t){
  const secs = parseTopic(t.body), out = []; const title = String(t.title || '').replace(/^\d+\.\s*/, '');

    add({kind: 'teach', tier: 'senior', q: 'How would you explain "' + title + '" to a junior developer who has never seen it?', ref: intro});
  }
  secs.forEach(sec => sec.blocks.forEach(b => {
    if(b.type === 'table' && b.rows.length >= 2){
      const useCol = b.head.findIndex((h, ix) => ix > 0 && /use|when|best|for|purpose|case/i.test(h));
      for(let a = 0; a < b.rows.length - 1 && a < 3; a++){
        const A = b.rows[a], B = b.rows[a + 1]; if(!A[0] || !B[0]) continue;

    }

const TIER_W = {junior: {basic: .55, mid: .40, senior: .05}, mid: {basic: .15, mid: .55, senior: .30}, senior: {basic: 0, mid: .35, senior: .65}};
const tierWeights = (level, tough) => !tough ? TIER_W[level] : level === 'junior' ? TIER_W.mid : level === 'mid' ? TIER_W.senior : {basic: 0, mid: .2, senior: .8};
function pickQuestions(cands, n, level, tough){
  const w = tierWeights(level, tough); const pool = shuffle(cands); const out = []; const topicUse = {}, kindUse = {};
  while(out.length < n && pool.length){
    const tiers = ['basic', 'mid', 'senior'].filter(t => w[t] > 0 && pool.some(c => c.tier === t));
    const usable = tiers.length ? tiers : ['basic', 'mid', 'senior'].filter(t => pool.some(c => c.tier === t));
    if(!usable.length) break;
    let r = Math.random() * usable.reduce((s, t) => s + (w[t] || .01), 0), tier = usable[usable.length - 1];
    for(const t of usable){ r -= (w[t] || .01); if(r <= 0){ tier = t; break; } }
    let best = null, bestScore = 1e9;
    pool.forEach((c, i) => {
      if(c.tier !== tier) return;
      if(c.kind === 'behaviour' && (kindUse.behaviour || 0) >= 1) return;

      const sc = (topicUse[c.topicId] || 0) * 3 + (kindUse[c.kind] || 0); if(sc < bestScore){ bestScore = sc; best = i; }
    });

/* ============================================================

   ============================================================ */

const voiceCfg = () => state.settings.voice;
let ttsToken = 0;

}

/* o: {onUpdate(finalText, interimText), onSilence(), onEnd(), onError(code), silenceMs} -> {stop()} | null */
function startListening(o){

  const rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  let finals = '', timer = null, ended = false;
  const bump = () => { if(o.silenceMs){ clearTimeout(timer); timer = setTimeout(() => { if(!ended && o.onSilence) o.onSilence(); }, o.silenceMs); } };
  rec.onresult = ev => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){ const r = ev.results[i]; if(r.isFinal) finals += r[0].transcript + ' '; else interim += r[0].transcript; }
    o.onUpdate(finals, interim); bump();

}

function studyStreak(){
  let n = 0; const base = new Date(); let i = 0;
  if(daySec(dayKey(base)) < MIN_DAY_S) i = 1;                              // today not studied yet: the streak still counts until midnight
  for(;; i++){ const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - i); if(daySec(dayKey(d)) >= MIN_DAY_S) n++; else break; if(i > 3650) break; }
  return n;
}

const RATE_SCORE = {good: 90, ok: 60, weak: 25};
function itemScore(i){ if(typeof i.score === 'number') return i.score; return RATE_SCORE[i.rating] != null ? RATE_SCORE[i.rating] : null; }
function itemSub(i){ if(i.sub) return i.sub; const q = i.qid && state.qa.find(x => x.id === i.qid); return q ? q.sub : null; }
const READY_LABEL = s => s == null ? 'No data yet' : s >= 75 ? 'Interview ready' : s >= 60 ? 'Almost there' : s >= 40 ? 'Getting there' : 'Needs work';
function readiness(){
  const answered = []; state.mock.sessions.forEach(s => s.items.forEach(i => { const sc = itemScore(i), sub = itemSub(i); if(sc != null && sub) answered.push({sc, sub, t: s.date, qid: i.qid, answer: i.answer}); }));
  answered.sort((a, b) => a.t - b.t);
  const seen = new Set(); state.mock.sessions.forEach(s => s.items.forEach(i => { if(i.qid && (i.answer || '').trim()) seen.add(i.qid); }));
  const subs = state.subs.map(sub => {
    const sigs = [];
    const ql = state.progress.quizLog.filter(x => x.sub === sub.id).slice(-60);
    if(ql.length) sigs.push({k: 'quiz', score: 100 * ql.filter(x => x.ok).length / ql.length, w: 3, n: ql.length});
    const ms = answered.filter(x => x.sub === sub.id).slice(-12);
    if(ms.length) sigs.push({k: 'mock', score: avg(ms.map(x => x.sc)), w: 4, n: ms.length});
    const ch = state.challenges.filter(c => c.sub === sub.id);
    if(ch.length){ const sv = ch.filter(c => state.progress.solved[c.id]).length; sigs.push({k: 'practice', score: 100 * sv / ch.length, w: 2, n: ch.length, solved: sv}); }
    const qs = state.qa.filter(q => q.sub === sub.id);
    if(qs.length){ const cov = qs.filter(q => seen.has(q.id)).length; sigs.push({k: 'coverage', score: 100 * cov / qs.length, w: 1, n: qs.length, covered: cov}); }
    const wsum = sigs.reduce((a, s) => a + s.w, 0);
    const score = wsum ? Math.round(sigs.reduce((a, s) => a + s.score * s.w, 0) / wsum) : null;
    const evidence = (ql.length ? ql.length : 0) + ms.length + (ch.length ? Math.min(ch.length, 3) : 0);
    return {sub, score, sigs, evidence, items: itemCount(sub.id), quiz: ql.length, mock: ms.length};
  });
  const withData = subs.filter(s => s.score != null);
  const wTot = withData.reduce((a, s) => a + Math.max(1, s.items), 0);
  const overall = withData.length ? Math.round(withData.reduce((a, s) => a + s.score * Math.max(1, s.items), 0) / wTot) : null;
  const evidenceTotal = subs.reduce((a, s) => a + s.evidence, 0);
  const cats = state.cats.map(c => {
    const own = subs.filter(s => s.sub.cat === c.id && s.score != null); const w = own.reduce((a, s) => a + Math.max(1, s.items), 0);
    return {cat: c, score: own.length ? Math.round(own.reduce((a, s) => a + s.score * Math.max(1, s.items), 0) / w) : null, subs: subs.filter(s => s.sub.cat === c.id)};
  });
  const days14 = lastDays(14).filter(d => daySec(d.key) >= MIN_DAY_S).length;
  const recentMock = state.mock.sessions.filter(s => Date.now() - s.date < 7 * 86400000).length;
  return {subs, cats, overall, evidenceTotal, days14, recentMock, label: evidenceTotal < 10 ? 'Not enough data yet' : READY_LABEL(overall), provisional: evidenceTotal < 10};
}
function suggestions(R){
  const out = [];
  const noData = R.subs.filter(s => s.score == null && s.items > 0);
  if(noData.length) out.push('You have content in ' + noData.slice(0, 3).map(s => pathLabel(s.sub.id)).join(', ') + ' but have not practised it yet. Take a quiz or a mock interview there.');
  const weak = R.subs.filter(s => s.score != null && s.score < 60).sort((a, b) => a.score - b.score);
  if(weak.length) out.push('Weakest area: ' + pathLabel(weak[0].sub.id) + ' (' + weak[0].score + '%). Re-read its Learn pages, then do a quiz and a mock on it.');
  if(R.days14 < 7) out.push('You practised on ' + R.days14 + ' of the last 14 days. Short daily sessions work better than long ones once a week.');
  if(!R.recentMock) out.push('No mock interview in the last 7 days. One 15-minute mock a week keeps you used to speaking your answers.');
  const live = state.mock.sessions.filter(s => s.kind === 'live').slice(0, 4); const lw = []; live.forEach(s => s.items.forEach(i => { if(i.answer) lw.push(wordsOf(i.answer).length); }));
  if(lw.length >= 3 && avg(lw) < 28) out.push('Your spoken or typed answers are short (about ' + Math.round(avg(lw)) + ' words). Aim for 40 to 80 words: what it is, how it works, an example, a trade-off.');
  const idk = live.reduce((a, s) => a + s.items.filter(i => i.idk).length, 0); if(idk >= 2) out.push('You said "I do not know" ' + idk + ' times in recent interviews. Those are the best topics to revise first.');
  if(weekSec() < state.track.goalMin * 60 * 4) out.push('This week you studied ' + fmtMin(weekSec()) + '. Your goal is ' + state.track.goalMin + ' minutes a day.');
  if(!out.length) out.push('Keep going: do a tougher mock (raise the level or switch on Tough) to find the next gaps.');
  return out;
}

/* ---------- building the question plan ---------- */
function buildPlan(cfg){
  const bank = cfg.bank ? visible(state.qa) : [], topics = cfg.gen ? visible(state.topics) : [];
  let n = clamp(Math.round(cfg.dur * 60 / LEVELS[cfg.level].secs), 3, 20) - (cfg.coding ? 1 : 0); n = Math.max(3, n);
  const bankItems = shuffle(bank).map(q => ({src: 'bank', qid: q.id, sub: q.sub, topic: pathLabel(q.sub), kind: 'bank', tier: 'mid', q: q.q,
    ref: [q.know, q.remember, q.example].filter(Boolean).join('\n'), hint: firstWords(q.know, 24)}));
  const genPool = dedupeAgainst((() => { let c = []; topics.forEach(t => c.push(...genFromTopic(t))); return c; })(), state.qa);
  let nBank = 0, nGen = 0;
  if(bankItems.length && genPool.length){ nBank = Math.min(bankItems.length, Math.ceil(n / 2)); nGen = Math.min(genPool.length, n - nBank); nBank = Math.min(bankItems.length, n - nGen); }
  else if(bankItems.length) nBank = Math.min(bankItems.length, n); else nGen = Math.min(genPool.length, n);
  const gen = pickQuestions(genPool, nGen, cfg.level, cfg.tough).map(c => Object.assign({src: 'gen', hint: c.kind === 'behaviour' ? 'Think of a real bug: what caused it, and how you found and fixed it.' : c.kind === 'predict' ? 'Work out what runs first, then what each console.log prints.' : firstWords(c.ref, 24)}, c));
  const chosen = bankItems.slice(0, nBank), plan = [];
  for(let i = 0; i < Math.max(chosen.length, gen.length); i++){ if(chosen[i]) plan.push(chosen[i]); if(gen[i]) plan.push(gen[i]); }
  plan.forEach((p, i) => { p.pid = 'p' + i; });
  return plan;
}
function liveAvailability(cfg){
  const bank = visible(state.qa).length, topics = visible(state.topics), candidates = dedupeAgainst((() => { let c = []; topics.forEach(t => c.push(...genFromTopic(t))); return c; })(), state.qa).length;
  const ch = visible(state.challenges).length || state.challenges.length;
  return {bank, topics: topics.length, candidates, challenges: ch};
}

/* ---------- conversation helpers ---------- */

}
function tierFor(a){ return a.cfg.tough ? 'tough' : a.cfg.level; }

/* ---------- asking questions ---------- */
async function liveNextQuestion(a, prefix){
  if(a.finished) return; const rem = remaining(a);
  if(a.cfg.coding && !a.codingDone && a.codingAt >= 0 && a.idx >= a.codingAt && rem > 150){ const ok = await liveCoding(a, prefix); if(ok) return; }
  if(a.idx >= a.plan.length || rem < 75){
    if(a.cfg.coding && !a.codingDone && rem > 150){ const ok = await liveCoding(a, prefix); if(ok) return; }
    return liveClose(a, prefix);
  }
  const p = a.plan[a.idx++];
  if(p.kind === 'predict'){ const r = await captureRun(p.code, p.lang, 10000); if(!r.ok || !r.lines.length) return liveNextQuestion(a, prefix); p.expected = r.lines.slice(0, 12); }
  const prev = a.items[a.items.length - 1];
  const lead = a.items.length === 0 ? 'Let us start with the technical part.' : (prev && prev.sub !== p.sub ? pickOne(PH.switchTopic) : pickOne(PH.next));
  const it = {pid: p.pid, src: p.src, qid: p.qid || null, sub: p.sub, topic: p.topic, kind: p.kind, tier: p.tier, q: p.q, ref: p.ref || '', code: p.code || '', lang: p.lang || '', expected: p.expected || null, hint: p.hint || '', answer: '', followups: 0, asked: [], idk: 0, hinted: false, score: null, firstScore: null, missing: [], hit: [], seconds: 0, startedAt: Date.now(), phase: p.kind === 'predict' ? 'predict' : 'answer'};
  a.items.push(it); a.cur = it; a.phase = 'question';
  await liveSay(a, (prefix ? prefix + ' ' : '') + lead + ' ' + p.q, false);
  if(p.kind === 'predict'){ const m = {who: 'card', kind: 'predict', code: p.code, t: Date.now()}; a.transcript.push(m); if(LV && LV.a === a) renderCard(a, m); save(); }
  if(LV && LV.a === a && voiceCfg().hands && SRClass() && voiceCfg().on) startLiveListening(a, true);
}
function nextMove(a, it, ev){
  const L = LEVELS[a.cfg.level]; const maxF = L.follow + (a.cfg.tough ? 1 : 0);
  if(it.followups >= maxF) return {type: 'done'};
  const asked = it.asked;
  if(ev.words < 10 && !asked.includes('expand')) return {type: 'expand'};
  if(ev.score < 45 && ev.missing.length && !asked.includes('missing')) return {type: 'missing', term: ev.missing.find(t => t.length > 3) || ev.missing[0]};
  if(!ev.hasExample && it.kind !== 'predict' && !asked.includes('example') && it.ref) return {type: 'example'};
  if(!ev.hasTradeoff && a.cfg.level !== 'junior' && !asked.includes('tradeoff') && it.ref) return {type: 'tradeoff'};
  if((a.cfg.tough || a.cfg.level === 'senior') && it.ref){ const t = PH.deep[it.followups % PH.deep.length]; if(!asked.includes('deep:' + t)) return {type: 'deep', text: t}; }
  return {type: 'done'};
}
function followText(mv){
  if(mv.type === 'expand') return pickOne(PH.expand);
  if(mv.type === 'missing') return pickOne(['You did not mention ' + mv.term + '. How does that fit in?', 'What role does ' + mv.term + ' play here?', 'Where does ' + mv.term + ' come into this?']);
  if(mv.type === 'example') return pickOne(PH.example);
  if(mv.type === 'tradeoff') return pickOne(PH.tradeoff);
  return mv.text;
}
function finalizeItem(it, ev){
  it.score = it.kind === 'predict' && it.predScore != null ? Math.round(0.5 * it.predScore + 0.5 * ev.score) : ev.score;

async function liveHandleAnswer(a, text){

    if(a.phase === 'closing'){ await liveSay(a, pickOne(PH.closeReply), false); return liveFinish(a, 'done'); }
    if(a.phase === 'coding-explain'){ return liveCodingExplained(a, text); }
    if(a.phase === 'coding'){ await liveSay(a, 'Go ahead and use the editor below. Press Submit solution when you are ready, or tell me how you are thinking about it.', false); return; }
    const it = a.cur; if(!it) return;
    if(IDK_RE.test(text) && wordsOf(text).length < 14){
      it.idk++;
      if(!it.hinted){ it.hinted = true; await liveSay(a, pickOne(PH.hint) + ' ' + it.hint + ' Have another go?', true); return; }
      const ev = evaluateAnswer(it.answer, it.ref); finalizeItem(it, ev); await liveNextQuestion(a, 'That is fine, we can come back to it in your report.'); return;
    }

      const out = it.expected.join(' / ');
      await liveSay(a, (it.predScore >= 70 ? 'Yes, that matches. The actual output is: ' : 'Not quite. The actual output is: ') + out + '. And why does it behave like that?', true); return;
    }
    it.answer = (it.answer ? it.answer + '\n\n' : '') + text;
    const ev = evaluateAnswer(it.answer, it.ref);

    const mv = nextMove(a, it, ev);
    if(mv.type === 'done'){ finalizeItem(it, ev); const pre = it.followups > 0 && it.firstScore != null && it.score > it.firstScore + 10 ? pickOne(PH.better) : pickOne(it.score >= 70 ? PH.ackGood : it.score >= 45 ? PH.ackOk : PH.ackWeak); await liveNextQuestion(a, pre); return; }
    it.followups++; it.asked.push(mv.type === 'deep' ? 'deep:' + mv.text : mv.type);
    await liveSay(a, (it.followups === 1 ? pickOne(PH.ackOk).replace(/\.$/, '') + '. ' : '') + followText(mv), true);
  } finally { a.busy = false; save(); }
}

/* ---------- coding exercise ---------- */
function pickCoding(a){
  const lv = a.cfg.level === 'junior' ? ['Easy'] : a.cfg.level === 'mid' ? (a.cfg.tough ? ['Medium', 'Hard'] : ['Easy', 'Medium']) : ['Medium', 'Hard'];
  let pool = visible(state.challenges); if(!pool.length) pool = state.challenges; if(!pool.length) return null;
  const pref = pool.filter(c => lv.includes(c.level)); const base = pref.length ? pref : pool;
  const unsolved = base.filter(c => !state.progress.solved[c.id]); return pickOne(unsolved.length ? unsolved : base);
}
async function liveCoding(a, prefix){
  const c = pickCoding(a); if(!c){ a.codingDone = true; return false; }
  a.coding = {cid: c.id, title: c.title, level: c.level, lang: c.lang, prompt: c.prompt, starter: c.starter, tests: c.tests, passed: 0, total: 0, tries: 0, score: null, explain: '', code: ''};
  a.phase = 'coding';
  await liveSay(a, (prefix ? prefix + ' ' : '') + 'Now I would like you to solve a short coding problem: ' + c.title + '. Take your time. When you are done, submit it and talk me through your approach.', false);
  const m = {who: 'card', kind: 'coding', t: Date.now()}; a.transcript.push(m); if(LV && LV.a === a){ renderCard(a, m); LV.setStatus('coding'); } save();
  return true;
}
function buildCodingCard(a, m){
  const k = a.coding; if(!k || !LV) return;
  const card = el('div', 'lv-code coding'); card.innerHTML = '<div class="lv-ct">Coding exercise: ' + esc(k.title) + ' <span class="chip ' + k.level.toLowerCase() + '">' + esc(k.level) + '</span></div>';
  const pm = el('div'); renderMd(k.prompt, pm); card.appendChild(pm);
  const runner = makeRunner({code: k.code || k.starter, lang: k.lang, tests: k.tests, maxHeight: 360, onChange: v => { k.code = v; }, onResult: (p, n) => codeResult(a, p, n)});
  card.appendChild(runner.el);
  const row = el('div', 'lv-crow'); const sub = el('button', 'btn primary', 'Submit solution'); sub.type = 'button'; const skip = el('button', 'btn ghost', 'Skip this exercise'); skip.type = 'button';
  sub.onclick = () => { if(a.busy) return; const rb = runner.el.querySelector('.rbtn.run'); if(rb && rb.style.display !== 'none') rb.click(); };
  skip.onclick = async () => { if(a.busy) return; a.busy = true; try { k.skipped = true; k.score = 0; a.codingDone = true; await liveSay(a, 'No problem, we will skip it and move on.', false); a.phase = 'question'; await liveNextQuestion(a, ''); } finally { a.busy = false; save(); } };
  row.append(sub, skip); card.appendChild(row); LV.chat.insertBefore(card, LV.typingEl); LV.scroll();
}
async function codeResult(a, p, n){
  if(a.finished || a.busy || !a.coding || a.phase !== 'coding') return; const k = a.coding; k.passed = p; k.total = n; k.tries++; a.busy = true;

    } else await liveSay(a, p + ' of ' + n + ' tests pass. Have another look at the failing ones, then submit again.', false);

}
async function liveCodingExplained(a, text){
  const k = a.coding; k.explain = text; const ev = evaluateAnswer(text, 'time complexity linear constant quadratic loop edge cases empty null input');
  k.score = Math.round(clamp((k.score == null ? 0 : k.score) * 0.85 + ev.score * 0.15, 0, 100));

/* ---------- closing and report ---------- */
async function liveClose(a, prefix){ a.phase = 'closing'; await liveSay(a, (prefix ? prefix + ' ' : '') + pickOne(PH.closeAsk), true); }
async function liveTimeUp(a){ if(a.finished || a.timeUp) return; a.timeUp = true; stopListening(); await liveSay(a, pickOne(PH.timeUp), false); liveFinish(a, 'time'); }
function buildLiveReport(s){
  const qs = s.items.filter(i => i.score != null); const parts = qs.map(i => i.score);
  let overall = parts.length ? avg(parts) : 0; if(s.coding && s.coding.score != null) overall = parts.length ? overall * 0.8 + s.coding.score * 0.2 : s.coding.score;
  overall = Math.round(overall);
  const bySub = {}; qs.forEach(i => { (bySub[i.sub] = bySub[i.sub] || {sub: i.sub, scores: [], missing: {}}).scores.push(i.score); i.missing.forEach(t => { bySub[i.sub].missing[t] = (bySub[i.sub].missing[t] || 0) + 1; }); });

  const comm = {avgWords: Math.round(avg(words)), exampleRate: answered.length ? Math.round(100 * answered.filter(i => i.hasExample).length / answered.length) : 0, idk: s.items.reduce((a, i) => a + (i.idk || 0), 0), followups: s.items.reduce((a, i) => a + (i.followups || 0), 0), unanswered: s.items.filter(i => i.unanswered).length};
  const tips = [];
  if(comm.avgWords < 30 && answered.length) tips.push('Your answers were short (about ' + comm.avgWords + ' words). Aim for 40 to 80: what it is, how it works, an example, a trade-off.');
